<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Focus</title><link rel="stylesheet" href="focus.css"></head><body><main><a href="../dashboard/index.html">← Dashboard</a><h1>Focus & website limits</h1><p id="status"></p><section><h2>Focus session</h2><label>Minutes (0 = open ended)<input id="duration" type="number" min="0" max="1440" value="45"></label><label>Blocked domains, one per line<textarea id="blocked" placeholder="instagram.com&#10;tiktok.com"></textarea></label><label>Enforcement<select id="level"><option value="hard">Hard block</option><option value="soft">Soft block</option></select></label><button id="start">Start focus</button> <button id="stop">Stop focus</button></section><section><h2>Daily website limit</h2><form id="limit-form"><input id="domain" placeholder="instagram.com" required><input id="minutes" type="number" min="1" max="1440" value="30" required><select id="limit-level"><option value="hard">Hard</option><option value="soft">Soft</option></select><button>Save</button></form><ul id="limits"></ul></section></main><script type="module" src="focus.js"></script></body></html>
